[package]
name = "raidzero_media"
version = "0.2.1"
edition = "2021"
description = "Async Rust client for the Raidzero API"
license = "MIT"
repository = "https://github.com/icelab-research/icelab"
keywords = ["media", "video", "audio", "api", "client"]
categories = ["api-bindings", "multimedia"]

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt", "time"] }
percent-encoding = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
