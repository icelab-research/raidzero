name: ellie-ai

on:
   pull_request:
      paths:
         - "apps/ellie_ai/**"
         - "infra/deploy/compose.prod.yml"
         - "infra/deploy/sfctl.sh"
         - "infra/deploy/sfctl.d/**"
         - "infra/deploy/smoke-vad.py"
         - ".github/workflows/ellie-ai.yml"
         - ".github/workflows/deploy-console.yml"
   push:
      branches: [main]
      paths:
         - "apps/ellie_ai/**"
         - "infra/deploy/compose.prod.yml"
         - "infra/deploy/sfctl.sh"
         - "infra/deploy/sfctl.d/**"
         - "infra/deploy/smoke-vad.py"
         - ".github/workflows/ellie-ai.yml"
         - ".github/workflows/deploy-console.yml"

concurrency:
   group: ellie-${{ github.ref }}
   cancel-in-progress: false

env:
   ELIXIR_VERSION: "1.18.4"
   OTP_VERSION: "27.3.4"
   APP_DIR: apps/ellie_ai

jobs:
   test:
      name: test
      runs-on: ubuntu-latest
      defaults:
         run:
            working-directory: ${{ env.APP_DIR }}
      steps:
         - uses: actions/checkout@v4

         - name: install elixir + otp
           uses: erlef/setup-beam@v1
           with:
              elixir-version: ${{ env.ELIXIR_VERSION }}
              otp-version: ${{ env.OTP_VERSION }}

         - name: install build tools
           run: sudo apt-get update && sudo apt-get install -y build-essential mold clang

         - name: cache deps
           uses: actions/cache@v4
           with:
              path: |
                 ${{ env.APP_DIR }}/deps
                 ${{ env.APP_DIR }}/_build
              key: mix-ellie-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('apps/ellie_ai/mix.lock') }}
              restore-keys: |
                 mix-ellie-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

         - name: install deps
           run: mix deps.get

         - name: format
           run: |
              mix format
              git diff --exit-code

         - name: compile (warnings as errors)
           run: mix compile --warnings-as-errors

         - name: run tests
           run: mix test

   build:
      name: build image
      needs: test
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      runs-on: ubuntu-latest
      permissions:
         contents: read
         packages: write
      steps:
         - uses: actions/checkout@v4

         - name: set up buildx
           uses: docker/setup-buildx-action@v3

         - name: log in to ghcr
           uses: docker/login-action@v3
           with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

         - name: build and push image
           uses: docker/build-push-action@v6
           with:
              context: ${{ env.APP_DIR }}
              push: true
              tags: |
                 ghcr.io/${{ github.repository }}/ellie-ai:latest
                 ghcr.io/${{ github.repository }}/ellie-ai:sha-${{ github.sha }}
              labels: |
                 org.opencontainers.image.revision=${{ github.sha }}
                 org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
              cache-from: type=gha,scope=ellie
              cache-to: type=gha,mode=max,scope=ellie

   deploy:
      name: deploy
      needs: build
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: ./.github/workflows/deploy-console.yml
      with:
         operation: deploy
         service: ellie
         tag: sha-${{ github.sha }}
      secrets: inherit
