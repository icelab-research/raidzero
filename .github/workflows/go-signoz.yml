name: go-signoz

on:
   pull_request:
      paths:
         - "go-signoz/**"
         - ".github/workflows/go-signoz.yml"
   push:
      branches: [main]
      paths:
         - "go-signoz/**"
         - ".github/workflows/go-signoz.yml"

concurrency:
   group: go-signoz-${{ github.ref }}
   cancel-in-progress: true

permissions:
   contents: read

jobs:
   test:
      name: test
      runs-on: ubuntu-latest
      defaults:
         run:
            working-directory: go-signoz
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
           with:
              persist-credentials: false

         - name: setup go
           uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
           with:
              go-version: "1.21"
              cache: false

         - name: check formatting
           run: |
              unformatted="$(gofmt -l .)"
              if [ -n "$unformatted" ]; then
                echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
              fi

         - name: vet
           run: go vet ./...

         - name: build
           run: go build ./...

         - name: test
           run: go test -race ./...

         - name: cross-compile (windows, darwin)
           run: |
              GOOS=windows GOARCH=amd64 go build ./...
              GOOS=darwin GOARCH=arm64 go build ./...
